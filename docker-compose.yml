services:
  app:
    build: .
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - db_data:/data
    restart: unless-stopped

volumes:
  db_data:
